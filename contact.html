    <div class="container page-header">
      <p class="eyebrow">Contact</p>
      <h1>Let's talk.</h1>
    </div>

    <section class="container">
      <div class="contact-layout">
        <div>
          <h3>Reach me directly</h3>
          <ul class="contact-list">
            <li>✉️ <a href="mailto:saeidha@ymail.com">saeidha@ymail.com</a></li>
            <li>
              🐙
              <a
                href="https://github.com/saeidha92"
                target="_blank"
                rel="noopener"
                >github.com/saeidha92</a
              >
            </li>
            <li>
              💼
              <a
                href="https://linkedin.com/in/saeidha92"
                target="_blank"
                rel="noopener"
                >linkedin.com/in/saeidha92</a
              >
            </li>
          </ul>
        </div>

        <div>
          <h3>Or send a message</h3>
          <form id="contactForm" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
              <div class="field-error" id="nameError"></div>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
              <div class="field-error" id="emailError"></div>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                required
              ></textarea>
              <div class="field-error" id="messageError"></div>
            </div>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p class="form-status" id="formStatus" role="status"></p>
          </form>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">

        <div class="footer-links">

            >GitHub</a

          <a href="mailto:saeidha@ymail.com">Email</a>
        </div>
