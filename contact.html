<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css files/body.css" />
    <link rel="stylesheet" href="css files/head.css" />
  </head>
  <body>
    <nav class="site-nav">
      <div class="container nav-inner">
        <a href="index.html" class="brand">saeidha.<span>github</span>.io</a>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-expanded="false"
          aria-controls="navLinks"
        >
          menu
        </button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </div>
    </nav>

    <div class="container page-header">
      <p class="eyebrow">contact</p>
      <h1>Let's talk.</h1>
    </div>

    <section class="container">
      <div class="contact-layout">
        <div>
          <h3>Reach me directly</h3>
          <ul class="contact-list">
            <li>✉️ <a href="saeidha@ymail.com">saeidha@ymail.com</a></li>
            <li>
              🐙
              <a
                href="https://github.com/saeidha92"
                target="_blank"
                rel="noopener"
                >github.com/saeidha92</a
              >
            </li>
            <li>
              💼
              <a
                href="https://linkedin.com/in/your-saeidha92"
                target="_blank"
                rel="noopener"
                >linkedin.com/in/saeidha92</a
              >
            </li>
          </ul>
        </div>

        <div>
          <h3>Or send a message</h3>
          <form id="contactForm" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required />
              <div class="field-error" id="nameError"></div>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
              <div class="field-error" id="emailError"></div>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                required
              ></textarea>
              <div class="field-error" id="messageError"></div>
            </div>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p class="form-status" id="formStatus" role="status"></p>
          </form>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© 2026 Saeidha. Built with HTML, CSS &amp; JS.</span>
        <div class="footer-links">
          <a href="https://github.com/saeidha92" target="_blank" rel="noopener"
            >GitHub</a
          >
          <a href="saeidha@ymail.com">Email</a>
        </div>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
